name: Build

on:
  push:
    paths:
      - app/**
      - gradle/**
      - androidx-media
      - build.gradle.kts
      - settings.gradle.kts
      - .forgejo/workflows/build.yml
      - "!**/strings.xml"
    tags:
      - 'v*'
    branches:
      - '*'
  pull_request:
    paths:
      - app/**
      - gradle/**
      - androidx-media
      - build.gradle.kts
      - settings.gradle.kts
      - .forgejo/workflows/build.yml
      - "!**/strings.xml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: Android
    runs-on: codeberg-medium
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: 'recursive'

      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Setup Android SDK
        uses: https://github.com/android-actions/setup-android@035682743ab223ec9c6169af09811dff8247e520

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Build with Gradle (release)
        id: build_release
        if: github.event_name == 'push' && env.SIGNING_KEY_ALIAS
        env:
          SIGNING_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          SIGNING_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SIGNING_STORE_FILE: ${{ github.workspace }}/release.keystore
        run: |
          echo "${{ secrets.KEYSTORE }}" | base64 -d > release.keystore
          ./gradlew :app:packageNonfreeRelease --stacktrace
          mv app/build/outputs/apk/**/**/*.apk ./
          ./gradlew :app:packageFossRelease --stacktrace
          mv app/build/outputs/apk/**/**/*.apk ./
          rm release.keystore

      - name: Build with Gradle (debug)
        id: build_debug
        if: github.event_name == 'pull_request'
        run: |
          ./gradlew :app:assembleNonfreeDebug --stacktrace
          mv app/build/outputs/apk/**/**/*.apk ./
          ./gradlew :app:assembleFossDebug --stacktrace
          mv app/build/outputs/apk/**/**/*.apk ./

      - name: Upload APK artifact
        uses: actions/upload-artifact@v6
        with:
          name: navic-release-android
          path: ./*.apk
          compression-level: 0
          if-no-files-found: ignore

  upload-artifacts-to-discord:
    name: Upload Artifacts to Discord
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/bleeding-edge')
    needs: [ build-android ]
    runs-on: codeberg-tiny
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v8

      - name: Post artifacts to Discord webhook
        shell: bash
        env:
          CI_BUILD_WEBHOOK: ${{ secrets.CI_BUILD_WEBHOOK }}
          BLEEDING_EDGE_CI_WEBHOOK: ${{ secrets.BLEEDING_EDGE_CI_WEBHOOK }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          shopt -s nullglob globstar
          
          if [ "$REF_NAME" = "bleeding-edge" ] && [ -n "$BLEEDING_EDGE_CI_WEBHOOK" ]; then
            WEBHOOK_URL="$BLEEDING_EDGE_CI_WEBHOOK"
          else
            WEBHOOK_URL="$CI_BUILD_WEBHOOK"
          fi

          files=()
          i=1
          for file in **/*.apk; do
            files+=("-F file${i}=@${file}")
            ((i++))
          done

          if (( ${#files[@]} == 0 )); then
            echo "No files to upload"
            exit 0
          fi

          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          payload=$(jq -n --arg content "Builds for [${GITHUB_SHA::7}](<$run_url>) https://klipy.com/gifs/new-navic-update" '{$content}')

          curl -XPOST "$WEBHOOK_URL" -F "payload_json=$payload" "${files[@]}"

  create-release:
    name: Create release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [ build-android ]
    runs-on: codeberg-tiny
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v8
        with:
          path: release

      - name: Publish release
        uses: actions/forgejo-release@v2.13.4
        with:
          direction: upload
          release-dir: release
          token: ${{ secrets.TOKEN }}
          override: true
          verbose: true
          hide-archive-link: true
          release-notes-assistant: true
